[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temis-sso-lab"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14,<2", "argon2-cffi>=23.1,<26", "asyncpg>=0.30,<1", "cryptography>=43,<47", "fastapi>=0.115,<1", "httpx>=0.27,<1", "PyJWT>=2.9,<3", "pydantic-settings>=2.6,<3", "redis>=5,<7", "sqlalchemy>=2.0,<3", "uvicorn>=0.32,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/temis_sso", "src/temis_bff", "src/resource_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["temis_sso", "temis_bff", "resource_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
